<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530" viewBox="0 0 1200 530" role="img" aria-labelledby="title desc">
<title id="title">stalkoreAutoLogin architecture</title><desc id="desc">The client loads the Forwarder, which starts sdk.dll and autoLogin.dll. Configuration comes from a local INI with per-field environment overrides. The SDK owns the private native adapter, and both SDK and plugin use public API contracts.</desc>
