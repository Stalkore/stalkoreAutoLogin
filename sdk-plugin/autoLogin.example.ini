# Copy to autoLogin.ini beside autoLogin.dll and fill [login] locally.
# Each defined RO_* environment variable overrides only its corresponding field.
dry_run = false
tick_milliseconds = 50

# X: wait before acknowledging a native disconnect or connection-error dialog.
autologin_dialog_close_seconds = 5
# Y: total login attempts per cycle, including the first. Map entry resets it.
autologin_max_attempts = 3
# T: wait after a failed attempt/dialog acknowledgment before sending login again.
autologin_retry_delay_seconds = 5
# Reset a stalled game connection after this many seconds without stage progress.
# An outstanding native SSO request must finish before any reset/resubmission.
autologin_timeout_seconds = 45
autologin_dialog_enabled = true

[login]
# Keep the local autoLogin.ini out of source control. Values are never logged.
username =
password =
# Zero-based server and occupied character indices.
server = 0
character = 0
# Optional existing PIN: four digits, with leading zeroes preserved.
pin =
